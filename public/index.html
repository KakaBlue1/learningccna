<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCNA Learning - Học & Kiểm tra</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #6366f1;
    --accent: #ec4899;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #06b6d4;
    --bg: #0a0a0f;
    --bg-2: #12121a;
    --card: #16161f;
    --border: #26263a;
    --text: #e4e4f0;
    --text-light: #8b8ba7;
    --text-muted: #5a5a75;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 10%, rgba(99,102,241,0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(236,72,153,0.06), transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== LAYOUT ===== */
  .layout {
    display: flex;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 280px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    position: fixed;
    height: 100vh;
    overflow-y: auto;
    z-index: 100;
    transition: transform 0.3s;
  }

  .sidebar-header {
    padding: 1.5rem 1.2rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg-2);
    z-index: 2;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 1rem;
  }
  .logo-icon {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    box-shadow: 0 4px 15px rgba(99,102,241,0.4);
  }
  .logo-text small {
    display: block;
    font-size: 0.65rem;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  /* Tabs chuyển giữa Học / Quiz */
  .main-tabs {
    display: flex;
    gap: 0.4rem;
    background: var(--bg);
    padding: 0.3rem;
    border-radius: 10px;
  }
  .main-tab {
    flex: 1;
    padding: 0.6rem 0.5rem;
    background: transparent;
    border: none;
    border-radius: 7px;
    color: var(--text-light);
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    transition: 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
  }
  .main-tab:hover { color: var(--text); }
  .main-tab.active {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    box-shadow: 0 4px 12px rgba(99,102,241,0.3);
  }

  .nav-section {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 1rem 0 0.5rem 1.2rem;
    letter-spacing: 1.2px;
    font-weight: 600;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.7rem 1.2rem;
    cursor: pointer;
    color: var(--text-light);
    transition: 0.2s;
    font-size: 0.88rem;
    border-left: 3px solid transparent;
    user-select: none;
    position: relative;
  }
  .nav-item:hover {
    background: rgba(99,102,241,0.08);
    color: var(--text);
  }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(99,102,241,0.15), transparent);
    color: var(--primary-light, #a5b4fc);
    border-left-color: var(--primary);
  }
  .nav-item .icon { font-size: 1rem; width: 20px; }
  .nav-item .arrow {
    margin-left: auto;
    font-size: 0.7rem;
    opacity: 0.5;
  }

  /* ===== MAIN ===== */
  .main {
    margin-left: 280px;
    flex: 1;
    padding: 2rem 2.5rem;
    width: calc(100% - 280px);
    max-width: 1100px;
  }

  /* ===== ARTICLE / LESSON ===== */
  .article {
    animation: slideUp 0.4s;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .article-header {
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .article-breadcrumb {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 0.8rem;
  }
  .article-breadcrumb span { color: var(--primary-light, #a5b4fc); }

  .article-title {
    font-size: 2rem;
    background: linear-gradient(135deg, #fff, #a5b4fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.8rem;
    line-height: 1.3;
  }

  .article-meta {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-light);
  }

  .badge {
    padding: 0.25rem 0.7rem;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge.category { background: rgba(99,102,241,0.15); color: #a5b4fc; }
  .badge.easy { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .badge.medium { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .badge.hard { background: rgba(239,68,68,0.15); color: #fca5a5; }

  .article-content {
    font-size: 0.95rem;
    line-height: 1.85;
    color: var(--text);
  }

  .article-content h2 {
    font-size: 1.4rem;
    color: var(--primary-light, #a5b4fc);
    margin: 2rem 0 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid rgba(99,102,241,0.2);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .article-content h2:first-child { margin-top: 0; }

  .article-content h3 {
    font-size: 1.1rem;
    color: #c7d2fe;
    margin: 1.5rem 0 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .article-content p {
    margin-bottom: 1rem;
    color: var(--text-light);
  }
  .article-content p strong { color: var(--text); font-weight: 700; }

  .article-content ul, .article-content ol {
    margin: 0.8rem 0 1.2rem 1.5rem;
    color: var(--text-light);
  }
  .article-content li {
    margin-bottom: 0.5rem;
    line-height: 1.75;
  }
  .article-content li strong { color: var(--text); }

  .article-content code {
    background: rgba(99,102,241,0.15);
    color: #a5b4fc;
    padding: 0.15rem 0.5rem;
    border-radius: 5px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.88em;
  }

  .article-content pre {
    background: #0a0a0f;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem;
    overflow-x: auto;
    margin: 1rem 0;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.85rem;
    line-height: 1.7;
    color: #e2e8f0;
    position: relative;
  }
  .article-content pre::before {
    content: '● ● ●';
    display: block;
    color: #333;
    font-size: 0.7rem;
    letter-spacing: 2px;
    margin-bottom: 0.7rem;
  }
  .article-content pre .cmt { color: #64748b; font-style: italic; }
  .article-content pre .kw { color: #f472b6; }
  .article-content pre .val { color: #6ee7b7; }
  .article-content pre .prompt { color: #fbbf24; }

  /* Info boxes */
  .info-box, .warning-box, .tip-box, .danger-box {
    padding: 1rem 1.2rem;
    border-radius: 12px;
    margin: 1.2rem 0;
    line-height: 1.7;
    font-size: 0.9rem;
    border-left: 4px solid;
    display: flex;
    gap: 0.8rem;
    align-items: flex-start;
  }
  .info-box {
    background: linear-gradient(135deg, rgba(6,182,212,0.1), rgba(6,182,212,0.02));
    border-color: var(--info);
    color: #67e8f9;
  }
  .warning-box {
    background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(245,158,11,0.02));
    border-color: var(--warning);
    color: #fcd34d;
  }
  .tip-box {
    background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(16,185,129,0.02));
    border-color: var(--success);
    color: #6ee7b7;
  }
  .danger-box {
    background: linear-gradient(135deg, rgba(239,68,68,0.1), rgba(239,68,68,0.02));
    border-color: var(--danger);
    color: #fca5a5;
  }
  .box-icon { font-size: 1.2rem; flex-shrink: 0; }
  .box-content { flex: 1; }
  .box-content strong { color: inherit; display: block; margin-bottom: 0.3rem; font-size: 0.95rem; }

  /* Tables */
  .article-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.2rem 0;
    font-size: 0.88rem;
    border-radius: 12px;
    overflow: hidden;
  }
  .article-content th {
    background: rgba(99,102,241,0.15);
    color: #a5b4fc;
    padding: 0.75rem 1rem;
    text-align: left;
    font-weight: 700;
    border: 1px solid var(--border);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .article-content td {
    padding: 0.7rem 1rem;
    border: 1px solid var(--border);
    color: var(--text-light);
  }
  .article-content td strong { color: var(--text); }
  .article-content tr:nth-child(even) td {
    background: rgba(255,255,255,0.02);
  }

  /* ASCII diagram */
  .diagram {
    background: #0a0a0f;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem;
    overflow-x: auto;
    margin: 1rem 0;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.8rem;
    line-height: 1.5;
    color: #a5b4fc;
    white-space: pre;
  }

  /* CTA card */
  .cta-card {
    background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(236,72,153,0.1));
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 16px;
    padding: 1.5rem;
    margin: 2rem 0 1rem;
    text-align: center;
  }
  .cta-card h3 {
    font-size: 1.2rem;
    color: var(--text);
    margin-bottom: 0.5rem;
    display: block;
  }
  .cta-card p {
    color: var(--text-light);
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }

  .btn {
    padding: 0.75rem 1.5rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
    transition: 0.2s;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .btn:hover {
    background: var(--bg-2);
    border-color: var(--primary);
    transform: translateY(-2px);
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border: none;
    color: white;
  }
  .btn-primary:hover {
    box-shadow: 0 8px 25px rgba(99,102,241,0.4);
  }

  /* ===== QUIZ (giống bản trước) ===== */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.7rem;
    margin-bottom: 1.5rem;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 0.8rem;
    border-radius: 12px;
    text-align: center;
  }
  .stat .num {
    font-size: 1.4rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat .num.green {
    background: linear-gradient(135deg, #10b981, #6ee7b7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat .num.red {
    background: linear-gradient(135deg, #ef4444, #fca5a5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat .label {
    font-size: 0.65rem;
    color: var(--text-light);
    text-transform: uppercase;
    margin-top: 0.2rem;
    letter-spacing: 0.5px;
  }

  .controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem;
    margin-bottom: 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
    align-items: flex-end;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    flex: 1;
    min-width: 130px;
  }
  .control-group label {
    font-size: 0.7rem;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .control-group select {
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    outline: none;
  }
  .control-group select:focus { border-color: var(--primary); }

  .btn-generate {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    border: none;
    padding: 0.7rem 1.5rem;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
  }
  .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.4); }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    margin-bottom: 1.5rem;
    animation: slideUp 0.4s;
  }

  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .badges { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .badge.source-static { background: rgba(99,102,241,0.15); color: #a5b4fc; }
  .badge.source-generated { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .q-number {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 1px;
  }
  .question-text {
    font-size: 1.1rem;
    line-height: 1.7;
    margin-bottom: 1.5rem;
    color: var(--text);
  }
  .question-text code {
    background: rgba(99,102,241,0.15);
    color: #a5b4fc;
    padding: 0.15rem 0.5rem;
    border-radius: 5px;
    font-family: 'Consolas', monospace;
    font-size: 0.95em;
  }

  .options { display: flex; flex-direction: column; gap: 0.6rem; }
  .option {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.2rem;
    background: var(--bg-2);
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
    font-size: 0.95rem;
    color: var(--text);
    font-family: inherit;
  }
  .option:hover:not(:disabled) {
    border-color: var(--primary);
    background: rgba(99,102,241,0.05);
    transform: translateX(4px);
  }
  .option:disabled { cursor: not-allowed; }
  .option-letter {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .option.correct {
    border-color: var(--success);
    background: rgba(16,185,129,0.1);
  }
  .option.correct .option-letter {
    background: var(--success);
    color: white;
    border-color: var(--success);
  }
  .option.wrong {
    border-color: var(--danger);
    background: rgba(239,68,68,0.1);
  }
  .option.wrong .option-letter {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
  }

  .explanation { margin-top: 1.5rem; animation: slideUp 0.4s; }
  .exp-banner {
    padding: 1rem 1.2rem;
    border-radius: 12px 12px 0 0;
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .exp-banner.correct {
    background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05));
    color: #6ee7b7;
    border: 1px solid rgba(16,185,129,0.3);
    border-bottom: none;
  }
  .exp-banner.wrong {
    background: linear-gradient(135deg, rgba(239,68,68,0.15), rgba(239,68,68,0.05));
    color: #fca5a5;
    border: 1px solid rgba(239,68,68,0.3);
    border-bottom: none;
  }
  .exp-content {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 0 0 12px 12px;
    padding: 1.5rem;
  }
  .exp-section { margin-bottom: 1.5rem; }
  .exp-section:last-child { margin-bottom: 0; }
  .exp-section-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--primary-light, #a5b4fc);
    margin-bottom: 0.8rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px dashed var(--border);
  }
  .exp-section-body {
    color: var(--text);
    line-height: 1.8;
    font-size: 0.92rem;
  }
  .exp-section-body strong { color: #a5b4fc; }
  .exp-section-body code {
    background: rgba(99,102,241,0.15);
    color: #a5b4fc;
    padding: 0.15rem 0.5rem;
    border-radius: 5px;
    font-family: 'Consolas', monospace;
    font-size: 0.9em;
  }

  .opt-analysis {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.8rem 1rem;
    margin-bottom: 0.6rem;
    display: flex;
    gap: 0.8rem;
    align-items: flex-start;
  }
  .opt-analysis.correct { border-left: 3px solid var(--success); background: rgba(16,185,129,0.05); }
  .opt-analysis.wrong { border-left: 3px solid var(--danger); background: rgba(239,68,68,0.05); }
  .opt-badge {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.75rem;
    flex-shrink: 0;
  }
  .opt-analysis.correct .opt-badge { background: var(--success); color: white; }
  .opt-analysis.wrong .opt-badge { background: var(--danger); color: white; }
  .opt-analysis-text {
    font-size: 0.88rem;
    line-height: 1.6;
    flex: 1;
  }
  .opt-analysis-text .opt-text { color: var(--text); margin-bottom: 0.3rem; }
  .opt-analysis-text .opt-reason { color: var(--text-light); font-size: 0.85rem; }

  .cisco-config {
    background: #0a0a0f;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.82rem;
    line-height: 1.7;
    color: #e2e8f0;
    overflow-x: auto;
    white-space: pre;
  }
  .cisco-config::before {
    content: '● ● ●';
    display: block;
    color: #333;
    font-size: 0.7rem;
    letter-spacing: 2px;
    margin-bottom: 0.6rem;
  }
  .cisco-config .cmt { color: #64748b; font-style: italic; }

  .related-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .related-tag {
    background: rgba(99,102,241,0.1);
    border: 1px solid rgba(99,102,241,0.3);
    color: #a5b4fc;
    padding: 0.35rem 0.8rem;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s;
  }
  .related-tag:hover {
    background: rgba(99,102,241,0.2);
    transform: translateY(-2px);
  }

  .actions {
    display: flex;
    gap: 0.8rem;
    margin-top: 1.5rem;
    flex-wrap: wrap;
  }
  .btn-primary-full {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border: none;
    color: white;
    padding: 0.7rem 1.4rem;
    border-radius: 10px;

// ===================== TAB SWITCHING =======================

let currentTab = 'learn';

function switchTab(tab, btn) {
  currentTab = tab;

  // Update tab buttons
  document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
  if (btn) {
    btn.classList.add('active');
  } else {
    // Nếu gọi không có btn (từ menu), tìm theo text
    document.querySelectorAll('.main-tab').forEach(b => {
      if ((tab === 'learn' && b.textContent.includes('Học')) ||
          (tab === 'quiz' && b.textContent.includes('Kiểm'))) {
        b.classList.add('active');
      }
    });
  }

  // Hiện/ẩn menu
  document.getElementById('learnMenu').style.display = tab === 'learn' ? 'block' : 'none';
  document.getElementById('quizMenu').style.display = tab === 'quiz' ? 'block' : 'none';

  // Load nội dung tương ứng
  if (tab === 'learn') {
    const activeNav = document.querySelector('#learnMenu .nav-item.active');
    if (activeNav) {
      activeNav.click();
    } else {
      loadLesson('osi');
    }
  } else {
    renderQuizPage();
  }

  // Đóng sidebar mobile
  if (window.innerWidth < 900) {
    document.getElementById('sidebar').classList.remove('open');
  }
}

  vlan: {
    title: '🔀 VLAN & Trunking',
    category: 'Network Access',

    readTime: '20 phút',
    content: `
      <h2>🎯 Mục tiêu</h2>
      <ul>
        <li>Hiểu VLAN là gì và lợi ích</li>
        <li>Phân biệt Access Port và Trunk Port</li>
        <li>Hiểu chuẩn 802.1Q và Native VLAN</li>
        <li>Biết cấu hình VLAN cơ bản trên Cisco</li>
      </ul>

      <h2>📖 VLAN là gì?</h2>
      <p><strong>VLAN (Virtual LAN)</strong> là cách chia 1 switch vật lý thành nhiều mạng logic (broadcast domain) riêng biệt. Các máy trong cùng VLAN có thể giao tiếp với nhau như đang ở cùng 1 switch riêng.</p>

      <div class="diagram">       Switch (1 thiết bị vật lý)
┌─────────────────────────────────────────────┐
│  ┌───────────────┐    ┌───────────────┐    │
│  │  VLAN 10      │    │  VLAN 20      │    │
│  │  (Sales)      │    │  (IT)         │    │
│  │  ┌─┐ ┌─┐ ┌─┐  │    │  ┌─┐ ┌─┐     │    │
│  │  │1│ │2│ │3│  │    │  │4│ │5│     │    │
│  │  └─┘ └─┘ └─┘  │    │  └─┘ └─┘     │    │
│  └───────────────┘    └───────────────┘    │
│   Không giao tiếp      Không giao tiếp     │
│   với VLAN 20          với VLAN 10         │
└─────────────────────────────────────────────┘</div>

      <h2>✅ Lợi ích của VLAN</h2>
      <ul>
        <li><strong>Giảm broadcast domain</strong> — Ít broadcast hơn → hiệu năng cao hơn</li>
        <li><strong>Tăng bảo mật</strong> — Cô lập traffic giữa các phòng ban</li>
        <li><strong>Linh hoạt</strong> — Di chuyển user giữa các phòng ban chỉ cần đổi VLAN</li>
        <li><strong>Tiết kiệm chi phí</strong> — Không cần mua switch riêng cho từng phòng</li>
      </ul>

      <h2>🔑 Access Port vs Trunk Port</h2>

      <table>
        <tr><th>Đặc điểm</th><th>Access Port</th><th>Trunk Port</th></tr>
        <tr><td>Mục đích</td><td>Nối thiết bị đầu cuối (PC, printer)</td><td>Nối giữa 2 switch/router</td></tr>
        <tr><td>Số VLAN</td><td>Chỉ 1 VLAN</td><td>Nhiều VLAN (10, 20, 30...)</td></tr>
        <tr><td>Frame</td><td>Không gắn tag</td><td>Gắn tag 802.1Q (trừ native VLAN)</td></tr>
        <tr><td>Cấu hình</td><td><code>switchport mode access</code></td><td><code>switchport mode trunk</code></td></tr>
      </table>

      <h2>📦 Chuẩn 802.1Q — VLAN Tagging</h2>
      <p>Khi frame đi qua trunk port, nó được <strong>chèn thêm 4-byte tag</strong> để đánh dấu VLAN ID:</p>

      <div class="diagram">Frame gốc (không tag):
┌────────┬────────┬──────────┬───────┐
│  Dest  │ Src MAC│   Type   │ Data  │
│  MAC   │        │          │       │
└────────┴────────┴──────────┴───────┘

Frame có tag 802.1Q:
┌────────┬────────┬──────────┬────────────┬───────┐
│  Dest  │ Src MAC│   TPID   │ VLAN ID +  │ Data  │
│  MAC   │        │  0x8100  │ Priority   │       │
└────────┴────────┴──────────┴────────────┴───────┘
                   └──── 4-byte tag ────┘</div>

      <h2>🏷️ Native VLAN</h2>
      <p><strong>Native VLAN</strong> là VLAN mà traffic đi qua trunk <strong>KHÔNG bị gắn tag</strong>. Mặc định là VLAN 1.</p>

      <div class="warning-box">
        <div class="box-icon">⚠️</div>
        <div class="box-content">
          <strong>Bảo mật:</strong> Cisco khuyến nghị đổi native VLAN khỏi VLAN 1 (thường sang <strong>VLAN 99</strong>) để tránh VLAN hopping attack. Native VLAN phải <strong>khớp ở cả 2 đầu trunk</strong>.

      </div>

      <h2>⚙️ Cấu hình VLAN Cisco</h2>

      <h3>1. Tạo VLAN</h3>
      <div class="cisco-config"><span class="cmt"># Tạo VLAN 10 và 20</span>
Switch(config)# <span class="kw">vlan</span> 10
Switch(config-vlan)# <span class="kw">name</span> Sales
Switch(config-vlan)# <span class="kw">exit</span>

Switch(config)# <span class="kw">vlan</span> 20
Switch(config-vlan)# <span class="kw">name</span> IT
Switch(config-vlan)# <span class="kw">exit</span></div>

      <h3>2. Gán cổng vào VLAN (Access Port)</h3>
      <div class="cisco-config"><span class="cmt"># Gán cổng Fa0/1 vào VLAN 10</span>
Switch(config)# <span class="kw">interface</span> fa0/1
Switch(config-if)# <span class="kw">switchport mode</span> access
Switch(config-if)# <span class="kw">switchport access vlan</span> 10

<span class="cmt"># Gán nhiều cổng cùng lúc</span>
Switch(config)# <span class="kw">interface range</span> fa0/5-10
Switch(config-if-range)# <span class="kw">switchport mode</span> access
Switch(config-if-range)# <span class="kw">switchport access vlan</span> 20</div>

      <h3>3. Cấu hình Trunk Port</h3>

  routing: {
    title: '🛣️ Routing & OSPF',
    category: 'IP Connectivity',
    difficulty: 'hard',
    readTime: '22 phút',
    content: `
      <h2>🎯 Mục tiêu</h2>
      <ul>
        <li>Hiểu Routing Table và cách router chọn đường đi</li>
        <li>Biết Static Route và Default Route</li>
        <li>Hiểu OSPF — giao thức định tuyến link-state</li>
        <li>Phân biệt Administrative Distance và Metric</li>
      </ul>

      <h2>📖 Routing là gì?</h2>
      <p><strong>Routing</strong> là quá trình router chọn đường đi tốt nhất cho packet từ mạng nguồn đến mạng đích. Router dựa vào <strong>Routing Table</strong> để quyết định.</p>

      <h2>📋 Routing Table</h2>
      <p>Khi bạn chạy <code>show ip route</code>, bạn sẽ thấy bảng định tuyến với các ký hiệu:</p>

      <table>
        <tr><th>Ký hiệu</th><th>Loại route</th><th>AD mặc định</th></tr>
        <tr><td><strong>C</strong></td><td>Connected (trực tiếp)</td><td>0</td></tr>
        <tr><td><strong>L</strong></td><td>Local (interface IP)</td><td>0</td></tr>
        <tr><td><strong>S</strong></td><td>Static</td><td>1</td></tr>
        <tr><td><strong>S*</strong></td><td>Default static route</td><td>1</td></tr>
        <tr><td><strong>D</strong></td><td>EIGRP</td><td>90</td></tr>
        <tr><td><strong>O</strong></td><td>OSPF</td><td>110</td></tr>
        <tr><td><strong>R</strong></td><td>RIP</td><td>120</td></tr>
      </table>

      <h2>🎯 Router chọn đường đi như thế nào?</h2>
      <p>Thứ tự ưu tiên:</p>
      <ol>
        <li><strong>Longest Prefix Match</strong> — Route có prefix dài nhất (cụ thể nhất) thắng</li>
        <li><strong>Administrative Distance</strong> — AD nhỏ hơn thắng (khi cùng prefix)</li>
        <li><strong>Metric</strong> — Metric nhỏ hơn thắng (khi cùng AD)</li>
      </ol>

      <h2>📌 Static Route</h2>
      <p><strong>Static route</strong> là route được cấu hình thủ công bởi admin. Ưu điểm: đơn giản, không tốn CPU. Nhược điểm: không tự động cập nhật khi topology thay đổi.</p>

      <h3>Cú pháp:</h3>
      <div class="cisco-config"><span class="cmt"># Cú pháp cơ bản</span>
Router(config)# <span class="kw">ip route</span> &lt;network&gt; &lt;mask&gt; &lt;next-hop | exit-interface&gt;

<span class="cmt"># Ví dụ: Route đến 192.168.2.0/24 qua 10.0.0.2</span>
Router(config)# <span class="kw">ip route</span> 192.168.2.0 255.255.255.0 10.0.0.2

<span class="cmt"># Default route (catch-all)</span>
Router(config)# <span class="kw">ip route</span> 0.0.0.0 0.0.0.0 203.0.113.1</div>

      <h2>🌐 OSPF — Open Shortest Path First</h2>
      <p>OSPF là giao thức định tuyến <strong>link-state</strong>, dùng thuật toán <strong>Dijkstra (SPF)</strong> để tính đường đi ngắn nhất. Đây là giao thức phổ biến nhất trong mạng doanh nghiệp.</p>

      <h3>Đặc điểm chính:</h3>
      <ul>
        <li>Thuật toán: <strong>Dijkstra (SPF)</strong></li>
        <li>Metric: <strong>Cost</strong> (tính từ bandwidth)</li>
        <li>AD mặc định: <strong>110</strong></li>
        <li>Hỗ trợ VLSM, CIDR</li>
        <li>Hội tụ nhanh</li>
        <li>Không giới hạn hop count</li>
      </ul>

      <h3>OSPF Areas:</h3>
      <p>OSPF chia mạng thành các <strong>area</strong> để giảm kích thước LSDB. <strong>Area 0</strong> là backbone area — bắt buộc phải có, tất cả area khác phải kết nối về Area 0.</p>

      <div class="diagram">         Area 0 (Backbone)
    ┌─────────────────────────┐
    │         R1              │
    │        /  \             │
    │      R2    R3           │
    └──────┬──────┬───────────┘
           │      │
      ┌────┴──┐  ┌┴────┐
      │Area 1 │  │Area 2│
      │  R4   │  │  R5  │
      └───────┘  └──────┘</div>

      <h3>Cấu hình OSPF:</h3>
      <div class="cisco-config"><span class="cmt"># Bật OSPF process 1</span>
Router(config)# <span class="kw">router ospf</span> 1

<span class="cmt"># Quảng bá mạng vào Area 0</span>
Router(config-router)# <span class="kw">network</span> 192.168.1.0 0.0.0.255 area 0
Router(config-router)# <span class="kw">network</span> 10.0.0.0 0.0.0.3 area 0

<span class="cmt"># Kiểm tra</span>
Router# <span class="kw">show ip ospf neighbor</span>
Router# <span class="kw">show ip ospf database</span>
Router# <span class="kw">show ip route ospf</span></div>

      <h3>Wildcard Mask</h3>
      <p>OSPF dùng <strong>wildcard mask</strong> (nghịch đảo subnet mask):</p>
      <p><code>Wildcard = 255.255.255.255 - Subnet Mask</code></p>

      <table>
        <tr><th>Subnet Mask</th><th>Wildcard</th></tr>
        <tr><td>255.255.255.0 (/24)</td><td>0.0.0.255</td></tr>
        <tr><td>255.255.255.252 (/30)</td><td>0.0.0.3</td></tr>
        <tr><td>255.255.0.0 (/16)</td><td>0.0.255.255</td></tr>
      </table>

      <h2>⚖️ So sánh giao thức định tuyến</h2>
      <table>
        <tr><th>Tiêu chí</th><th>RIP</th><th>OSPF</th><th>EIGRP</th></tr>
        <tr><td>Loại</td><td>Distance-vector</td><td>Link-state</td><td>Advanced DV</td></tr>
        <tr><td>Thuật toán</td><td>Bellman-Ford</td><td>Dijkstra</td><td>DUAL</td></tr>
        <tr><td>Metric</td><td>Hop count</td><td>Cost</td><td>BW + Delay</td></tr>
        <tr><td>AD</td><td>120</td><td>110</td><td>90</td></tr>
        <tr><td>Max hop</td><td>15</td><td>Không giới hạn</td><td>255</td></tr>
      </table>

      <h2>⚠️ Lưu ý thi CCNA</h2>
      <div class="warning-box">
        <div class="box-icon">⚠️</div>
        <div class="box-content">
          <strong>Bẫy hay gặp:</strong>
          <ul style="margin-top: 0.5rem;">
            <li>Longest prefix match <strong>luôn thắng</strong> trước khi so AD</li>
            <li>OSPF dùng wildcard mask, không phải subnet mask</li>
            <li>Area 0 là backbone, mọi area phải kết nối về Area 0</li>
            <li><code>ip default-gateway</code> dùng cho switch L2, <code>ip route 0.0.0.0</code> dùng cho router</li>
          </ul>
        </div>
      </div>

      <div class="cta-card">
        <h3>🎯 Kiểm tra Routing?</h3>
        <p>Làm quiz Routing để kiểm tra kiến thức!</p>
        <button class="btn btn-primary" onclick="goToQuiz('Routing')">
          Làm quiz Routing →
        </button>
      </div>
    `
  },

  acl: {
    title: '🛡️ ACL — Access Control List',
    category: 'Security Fundamentals',
    difficulty: 'medium',
    readTime: '18 phút',
    content: `
      <h2>🎯 Mục tiêu</h2>
      <ul>
        <li>Hiểu ACL là gì và mục đích</li>
        <li>Phân biệt Standard và Extended ACL</li>
        <li>Hiểu implicit deny ở cuối mỗi ACL</li>
        <li>Biết vị trí đặt ACL đúng cách</li>
      </ul>

      <h2>📖 ACL là gì?</h2>
      <p><strong>ACL (Access Control List)</strong> là danh sách các quy tắc (rules) dùng để <strong>lọc traffic</strong> trên router/switch. Mỗi quy tắc cho phép (permit) hoặc chặn (deny) traffic dựa trên tiêu chí cụ thể.</p>

      <h2>🔑 2 loại ACL chính</h2>

      <table>
        <tr><th>Tiêu chí</th><th>Standard ACL</th><th>Extended ACL</th></tr>
        <tr><td>Số hiệu</td><td>1-99, 1300-1999</td><td>100-199, 2000-2699</td></tr>
        <tr><td>Lọc theo</td><td>Source IP</td><td>Source, Dest, Protocol, Port</td></tr>
        <tr><td>Đặt ở</td><td>Gần <strong>destination</strong></td><td>Gần <strong>source</strong></td></tr>
        <tr><td>Ví dụ</td><td><code>access-list 10 permit 192.168.1.0 0.0.0.255</code></td><td><code>access-list 100 permit tcp any any eq 80</code></td></tr>
      </table>

      <h2>⚠️ Implicit Deny — Bẫy thi quan trọng</h2>
      <div class="danger-box">
        <div class="box-icon">🚨</div>
        <div class="box-content">
          <strong>Cuối MỖI ACL luôn có "deny any" ngầm định!</strong>
          <p style="margin-top: 0.5rem;">Traffic không match bất kỳ dòng nào trong ACL sẽ bị <strong>DROP</strong>. Đây là lý do ACL cần ít nhất 1 dòng permit, nếu không chặn hết.</p>
        </div>
      </div>

      <p><strong>Ví dụ:</strong> ACL sau chỉ permit 2 subnet, nhưng traffic từ subnet khác sẽ bị chặn:</p>

      <div class="cisco-config">access-list 10 permit 192.168.1.0 0.0.0.255
access-list 10 permit 10.0.0.0 0.0.0.255
<span class="cmt"># ← Ẩn: deny any (ngầm định)</span></div>

      <h2>🧮 Wildcard Mask</h2>
      <p>ACL dùng <strong>wildcard mask</strong> (nghịch đảo subnet mask):</p>
      <p><code>Wildcard = 255.255.255.255 - Subnet Mask</code></p>

      <table>
        <tr><th>Mục đích</th><th>Wildcard</th><th>Ý nghĩa</th></tr>
        <tr><td>Chính xác 1 host</td><td><code>0.0.0.0</code></td><td>Cả 32 bit phải khớp</td></tr>
        <tr><td>1 subnet /24</td><td><code>0.0.0.255</code></td><td>24 bit đầu khớp</td></tr>
        <tr><td>Tất cả</td><td><code>255.255.255.255</code></td><td>Không cần khớp bit nào (= <code>any</code>)</td></tr>
      </table>

      <h2>⚙️ Cấu hình ACL</h2>

      <h3>Standard ACL</h3>
      <div class="cisco-config"><span class="cmt"># Cho phép subnet 192.168.1.0/24</span>
Router(config)# <span class="kw">access-list</span> 10 permit 192.168.1.0 0.0.0.255
Router(config)# <span class="kw">access-list</span> 10 permit 10.0.0.0 0.0.0.255

<span class="cmt"># Áp dụng vào interface (hướng vào)</span>
Router(config)# <span class="kw">interface</span> gi0/1
Router(config-if)# <span class="kw">ip access-group</span> 10 in

<span class="cmt"># Kiểm tra</span>
Router# <span class="kw">show access-lists</span></div>

      <h3>Extended ACL (khuyến nghị)</h3>
      <div class="cisco-config"><span class="cmt"># Cho phép HTTP từ 192.168.1.0/24 đến bất kỳ</span>
Router(config)# <span class="kw">access-list</span> 100 permit tcp 192.168.1.0 0.0.0.255 any eq 80

<span class="cmt"># Cho phép HTTPS</span>
Router(config)# <span class="kw">access-list</span> 100 permit tcp 192.168.1.0 0.0.0.255 any eq 443

<span class="cmt"># Cho phép ping (ICMP)</span>
Router(config)# <span class="kw">access-list</span> 100 permit icmp 192.168.1.0 0.0.0.255 any

<span class="cmt"># Chặn tất cả còn lại (tường minh)</span>
Router(config)# <span class="kw">access-list</span> 100 deny ip any any

<span class="cmt"># Áp dụng</span>
Router(config)# <span class="kw">interface</span> gi0/0
Router(config-if)# <span class="kw">ip access-group</span> 100 in</div>

      <h2>📍 Vị trí đặt ACL</h2>

      <div class="info-box">
        <div class="box-icon">📌</div>
        <div class="box-content">
          <strong>Nguyên tắc vàng:</strong><br>
          • <strong>Standard ACL</strong> → Đặt <strong>gần destination</strong><br>
          • <strong>Extended ACL</strong> → Đặt <strong>gần source</strong><br><br>
          <strong>Lý do:</strong> Standard chỉ lọc source nên nếu đặt gần source sẽ chặn nhầm traffic của các mạng khác. Extended lọc chi tiết nên đặt gần source để tiết kiệm băng thông.
        </div>
      </div>

      <h2>💡 Ví dụ thực tế</h2>
      <div class="info-box">
        <div class="box-icon">🏢</div>
        <div class="box-content">
          <strong>Yêu cầu:</strong> Chặn phòng Kế toán (VLAN 30) truy cập vào Server nội bộ (192.168.100.10), nhưng vẫn cho phép các phòng khác.<br><br>
          <strong>Giải pháp:</strong> Dùng Extended ACL trên router, áp vào cổng kết nối VLAN 30, hướng "in".
        </div>
      </div>

      <h2>⚠️ Lưu ý thi CCNA</h2>
      <div class="warning-box">
        <div class="box-icon">⚠️</div>
        <div class="box-content">
          <strong>Bẫy phổ biến:</strong>
          <ul style="margin-top: 0.5rem;">
            <li>Implicit deny ở cuối — traffic không match sẽ bị DROP</li>
            <li>Không thể xóa 1 dòng ACL — phải xóa toàn bộ và viết lại (trừ named ACL)</li>
            <li>Thứ tự các dòng <strong>rất quan trọng</strong> — ACL xử lý từ trên xuống, dừng khi match</li>
            <li>ACL không ảnh hưởng traffic của chính router (chỉ traffic đi qua)</li>
          </ul>
        </div>
      </div>

      <div class="cta-card">
        <h3>🎯 Kiểm tra ACL?</h3>
        <p>Làm quiz ACL để nắm vững kiến thức!</p>
        <button class="btn btn-primary" onclick="goToQuiz('ACL')">
          Làm quiz ACL →
        </button>
      </div>
    `
  },

  nat: {
    title: '🔄 NAT & PAT',
    category: 'IP Services',
    difficulty: 'medium',
    readTime: '15 phút',
    content: `
      <h2>🎯 Mục tiêu</h2>
      <ul>
        <li>Hiểu NAT là gì và tại sao cần</li>
        <li>Phân biệt 3 loại NAT: Static, Dynamic, PAT</li>
        <li>Biết cấu hình NAT cơ bản</li>
        <li>Hiểu các thuật ngữ Inside/Outside Local/Global</li>
      </ul>

      <h2>📖 NAT là gì?</h2>
      <p><strong>NAT (Network Address Translation)</strong> là kỹ thuật chuyển đổi địa chỉ IP private ↔ public. Được tạo ra để giải quyết tình trạng <strong>cạn kiệt IPv4</strong>.</p>

      <h2>🎯 Tại sao cần NAT?</h2>
      <ul>
        <li><strong>Tiết kiệm Public IP</strong> — Nhiều máy dùng chung 1 Public IP</li>
        <li><strong>Bảo mật</strong> — Ẩn IP nội bộ khỏi Internet</li>
        <li><strong>Linh hoạt</strong> — Đổi IP nội bộ không ảnh hưởng bên ngoài</li>
      </ul>

      <h2>🔑 3 loại NAT</h2>

      <table>
        <tr><th>Loại</th><th>Ánh xạ</th><th>Ứng dụng</th></tr>
        <tr><td><strong>Static NAT</strong></td><td>1-1 cố định</td><td>Public server nội bộ</td></tr>
        <tr><td><strong>Dynamic NAT</strong></td><td>1-1 từ pool</td><td>Ít dùng</td></tr>
        <tr><td><strong>PAT (NAT Overload)</strong></td><td>N-1 (nhiều-1)</td><td>Phổ biến nhất — mọi nhà</td></tr>
      </table>

      <h2>📊 So sánh chi tiết</h2>

      <div class="diagram">Static NAT (1-1 cố định):
  192.168.1.10  ←→  203.0.113.10
  (luôn như vậy)

Dynamic NAT (1-1 từ pool):
  192.168.1.10  →  203.0.113.10
  192.168.1.11  →  203.0.113.11
  (khi cần, có thể hết pool)

PAT (N-1):
  192.168.1.10:5000  →  203.0.113.1:10001
  192.168.1.11:5000  →  203.0.113.1:10002
  192.168.1.12:5000  →  203.0.113.1:10003
  (phân biệt bằng port)</div>

      <h2>📚 Thuật ngữ cần nhớ</h2>

      <table>
        <tr><th>Thuật ngữ</th><th>Ý nghĩa</th></tr>
        <tr><td><strong>Inside Local</strong></td><td>IP private của host nội bộ (VD: 192.168.1.10)</td></tr>
        <tr><td><strong>Inside Global</strong></td><td>IP public sau khi NAT (VD: 203.0.113.1)</td></tr>
        <tr><td><strong>Outside Local</strong></td><td>IP của host bên ngoài (nhìn từ trong)</td></tr>
        <tr><td><strong>Outside Global</strong></td><td>IP public thật của host bên ngoài</td></tr>
      </table>

      <h2>⚙️ Cấu hình PAT (NAT Overload)</h2>

      <div class="cisco-config"><span class="cmt"># Bước 1: Định nghĩa ACL cho traffic cần NAT</span>
Router(config)# <span class="kw">access-list</span> 1 permit 192.168.1.0 0.0.0.255

<span class="cmt"># Bước 2: Cấu hình NAT overload (dùng IP của interface ngoài)</span>
Router(config)# <span class="kw">ip nat inside source list</span> 1 <span class="kw">interface</span> gi0/0 <span class="kw">overload</span>

<span class="cmt"># Bước 3: Đánh dấu inside interface (nối LAN)</span>
Router(config)# <span class="kw">interface</span> gi0/1
Router(config-if)# <span class="kw">ip nat inside</span>

<span class="cmt"># Bước 4: Đánh dấu outside interface (nối WAN)</span>
Router(config)# <span class="kw">interface</span> gi0/0
Router(config-if)# <span class="kw">ip nat outside</span>

<span class="cmt"># Kiểm tra</span>
Router# <span class="kw">show ip nat translations</span>
Router# <span class="kw">show ip nat statistics</span></div>

      <h2>🔍 Output của show ip nat translations</h2>

function loadLesson(id, el) {
  const lesson = LESSONS[id];
  if (!lesson) return;

  // Update active nav
  if (el) {
    document.querySelectorAll('#learnMenu .nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
  }

  // Render
  document.getElementById('contentArea').innerHTML = `
    <div class="article">
      <div class="article-header">
        <div class="article-breadcrumb">📖 Tài liệu › <span>${lesson.category}</span></div>
        <h1 class="article-title">${lesson.title}</h1>
        <div class="article-meta">
          <span class="badge category">${lesson.category}</span>
          <span class="badge ${lesson.difficulty}">${lesson.difficulty}</span>
          <span>⏱️ ${lesson.readTime}</span>
        </div>
      </div>
      <div class="article-content">
        ${lesson.content}
      </div>
    </div>
  `;

  // Scroll top
  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.querySelector('.main').scrollTop = 0;
}

// ============================================================
// ================== GO TO QUIZ =============================
// ============================================================
function goToQuiz(category) {
  switchTab('quiz');
  // Sau khi chuyển sang quiz, tự động set category
  setTimeout(() => {
    if (category) {
      const sel = document.getElementById('topicSelect');
      if (sel) {
        for (let opt of sel.options) {
          if (opt.value.toLowerCase() === category.toLowerCase() ||
              opt.textContent.toLowerCase().includes(category.toLowerCase())) {
            sel.value = opt.value;
            break;
          }
        }
      }
    }
  }, 100);
}
</script>
